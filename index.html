<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Learning Progress Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>JavaScript Learning Progress Dashboard</h2>

<form onsubmit="return validateForm()">

<label>Name:</label>
<input type="text" id="name">

<label>Roll Number:</label>
<input type="number" id="roll">

<label>Topics Completed:</label>
<input type="number" id="topics">

<label>Practice Hours:</label>
<input type="number" id="hours">

<label>Confidence Rating (1-10):</label>
<input type="number" id="rating">

<input type="submit" value="Submit">

</form>

<div id="result"></div>

</div>


<script src="script.js"></script>

</body>
</html>
